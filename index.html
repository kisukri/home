<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>__SITE_TITLE__</title>
    <meta name="theme-color" content="__BASE_BACKGROUND__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style id="boot-style">
      html,
      body {
        margin: 0;
        background: __BASE_BACKGROUND__;
      }

      #boot {
        --boot-top: #0d1435;
        --boot-mid: #2e2c66;
        --boot-low: #6b4a7c;
        --boot-ink: 246 243 240;
        --boot-glow: 243 236 216;

        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: linear-gradient(to bottom, var(--boot-top) 0%, var(--boot-mid) 55%, var(--boot-low) 100%);
        color: rgb(var(--boot-ink));
        transition: opacity 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      #boot.leave {
        opacity: 0;
        pointer-events: none;
      }

      #boot .orbit {
        position: relative;
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
        transition:
          transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      #boot.leave .orbit {
        transform: scale(1.35);
        opacity: 0;
      }

      #boot .core {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgb(var(--boot-glow));
        box-shadow:
          0 0 18px 4px rgb(var(--boot-glow) / 0.55),
          0 0 70px 26px rgb(var(--boot-glow) / 0.18);
        animation: boot-breathe 2.8s ease-in-out infinite;
      }

      #boot .sat {
        position: absolute;
        inset: 0;
        animation: boot-spin 4.8s linear infinite;
      }

      #boot .sat::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: rgb(var(--boot-ink) / 0.85);
        box-shadow: 0 0 8px rgb(var(--boot-ink) / 0.6);
      }

      #boot .sat:nth-child(2) {
        animation-delay: -1.6s;
        opacity: 0.6;
      }

      #boot .sat:nth-child(3) {
        animation-delay: -3.2s;
        opacity: 0.35;
      }

      #boot .kanji {
        margin: 6px 0 0;
        font:
          400 26px/1 'Hiragino Mincho ProN',
          'Yu Mincho',
          'YuMincho',
          'Noto Serif JP',
          'Noto Serif CJK JP',
          serif;
        color: rgb(var(--boot-ink) / 0.9);
        animation: boot-rise 1s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      #boot .note {
        margin: 0;
        padding-left: 0.6em;
        font:
          500 11px/1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        color: transparent;
        background: linear-gradient(
            100deg,
            rgb(var(--boot-ink) / 0.3) 35%,
            rgb(var(--boot-ink) / 0.95) 50%,
            rgb(var(--boot-ink) / 0.3) 65%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation:
          boot-shine 2.6s ease-in-out infinite,
          boot-rise 1s 0.15s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(0.85);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-shine {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::before {
          animation: none !important;
        }
        #boot .note {
          color: rgb(var(--boot-ink) / 0.6);
        }
      }

      #fallback {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 12vh 24px 48px;
        background: __BASE_BACKGROUND__;
        color: #f6f3f0;
        font:
          16px/1.7 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }

      #fallback h1 {
        margin: 0;
        font-size: 2.6rem;
        font-weight: 300;
      }

      #fallback h2 {
        margin: 32px 0 6px;
        font-size: 0.8rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      #fallback ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 20px;
        max-width: 560px;
        margin: 0 auto;
        padding: 0;
        list-style: none;
      }

      #fallback a {
        color: #ffd9a8;
      }

      #fallback footer {
        margin-top: 40px;
        font-size: 0.8rem;
        opacity: 0.8;
      }
    </style>
    <noscript>
      <style>
        #boot {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="orbit">
        <span class="sat"></span>
        <span class="sat"></span>
        <span class="sat"></span>
        <span class="core"></span>
      </div>
      <p class="kanji"></p>
      <p class="note">Loading</p>
    </div>
    <div id="app">__FALLBACK__</div>
    <script id="boot-script">
      ;(function (data) {
        var boot = document.getElementById('boot')
        var query = new URLSearchParams(location.search)
        var has = function (name) {
          return typeof name === 'string' && Object.prototype.hasOwnProperty.call(data.periods, name)
        }

        var name = location.hash.slice(1)
        if (!has(name)) name = query.get('period')
        if (!has(name)) {
          var now = new Date()
          var raw = query.get('hour')
          var hour = raw === null || raw.trim() === '' ? NaN : Number(raw)
          if (!(hour >= 0 && hour < 24)) hour = now.getHours() + now.getMinutes() / 60
          name = data.wrap
          for (var i = 0; i < data.bounds.length; i++) {
            if (hour < data.bounds[i][0]) {
              name = data.bounds[i][1]
              break
            }
          }
        }

        var period = data.periods[name]
        boot.style.setProperty('--boot-top', period.sky[0])
        boot.style.setProperty('--boot-mid', period.sky[1])
        boot.style.setProperty('--boot-low', period.sky[2])
        boot.style.setProperty('--boot-ink', period.ink)
        boot.style.setProperty('--boot-glow', period.glow)
        boot.querySelector('.kanji').textContent = period.label
        document.documentElement.dataset.theme = period.theme
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.content = period.sky[0]

        var fallback = document.getElementById('fallback')
        function reveal() {
          if (fallback && fallback.isConnected && boot.isConnected) boot.remove()
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.target === window || (e.target && e.target.tagName === 'SCRIPT')) reveal()
          },
          true,
        )
        setTimeout(reveal, data.timeout)
      })(__BOOT_DATA__)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
